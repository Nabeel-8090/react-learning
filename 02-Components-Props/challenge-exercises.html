<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenge Exercises</title>
</head>
<body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script type="text/babel">
        function ProductDetails({ imageSrc, name, price, discountPrice }) {
            return (
                <div>
                    <img src={imageSrc} width="150" />
                    <p>{name}</p>
                    {!discountPrice ? (
                        <p>Price: ${price}</p>
                    ) : (
                        <del>Price: ${price}</del>
                    )}
                    {discountPrice && (
                        <p>Discount price: ${discountPrice}</p>
                    )}
                    <button>Add to Cart</button>
                </div>
            );
        }

        function App() {
            return (
                <>
                    <ProductDetails
                        imageSrc="images/cotton-socks.png"
                        name="Cotton socks"
                        price="10.90"
                        discountPrice="5.45"
                    />
                    <ProductDetails
                        imageSrc="images/tennis-balls.png"
                        name="Tennis balls"
                        price="6.00"
                    />
                    <ProductDetails
                        imageSrc="images/plain-t-shirt.png"
                        name="Plan T-Shirt"
                        price="7.99"
                    />
                </>
            );
        }

        const container = document.querySelector('.js-container');
        ReactDOM.createRoot(container).render(<App />);
    </script>
</body>
</html>

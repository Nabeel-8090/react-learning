<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot</title>
</head>
<body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script type="text/babel">
        function ChatInput({ chatMessages, setChatMessages, isLoading, setIsLoading }) {
            const [ inputText, setInputText ] = React.useState('');

            function saveInputText(event) {
                setInputText(event.target.value);
            }

            async function sendMessage(event) {
                if (event.type === 'click' || event.key === 'Enter') {
                    if (isLoading || !inputText.trim()) {
                        return;
                    }
                    setIsLoading(true);
                    setInputText('');

                    const newChatMessages = [
                        ...chatMessages,
                        {
                            message: inputText,
                            sender: 'user',
                            id: crypto.randomUUID()
                        }
                    ]
                    setChatMessages(newChatMessages);

                    const response = await Chatbot.getResponseAsync(inputText);
                    setChatMessages([
                        ...newChatMessages,
                        {
                            message: response,
                            sender: 'robot',
                            id: crypto.randomUUID()
                        }
                    ]);
                    setIsLoading(false);

                } else if (event.key === 'Escape') {
                    setInputText('');
                }
            }

            return (
                <>
                    <input
                        placeholder="Send a message to Chatbot"
                        size="30"
                        onChange={saveInputText}
                        value={inputText}
                        onKeyDown={sendMessage}
                    />
                    <button
                        onClick={sendMessage}
                    >Send</button>
                </>
            );
        }

        function ChatMessage({ message, sender}) {
            return (
                <div>
                    {sender === 'robot' && (
                        <img src="images/robot.png" width="50" />
                    )}
                    {message}
                    {sender === 'user' && (
                        <img src="images/user.png" width="50" />
                    )}
                </div>
            );
        }

        function ChatMessages({ chatMessages, isLoading }) {
            return (
                <>
                    {chatMessages.map((chatMessage) => {
                        return (
                            <ChatMessage 
                                message={chatMessage.message}
                                sender={chatMessage.sender}
                                key={chatMessage.id}
                            />
                        );
                    })}
                    {isLoading && <p>Loading...</p>}
                </>
            );
        }

        function App() {
            const [ chatMessages, setChatMessages ] = React.useState([
                {
                    message: 'hello chatbot',
                    sender: 'user',
                    id: 'id1'
                },
                {
                    message: 'Hello! How can I help you?',
                    sender: 'robot',
                    id: 'id2'
                },
                {
                    message: 'can you get me todays date?',
                    sender: 'user',
                    id: 'id3'
                },
                {
                    message: 'Today is August 16',
                    sender: 'robot',
                    id: 'id4'
                }
            ]);
            const [ isLoading, setIsLoading ] = React.useState(false);
            /*
            const chatMessages = array[0]; current data
            const setChatMessages = array[1]; updater function
            const [ chatMessages, setChatMessages ] = array;
            */

            return (
                <>
                    <ChatInput
                        chatMessages={chatMessages}
                        setChatMessages={setChatMessages}
                        isLoading={isLoading}
                        setIsLoading={setIsLoading}
                    />
                    <ChatMessages
                        chatMessages={chatMessages}
                        isLoading={isLoading}
                    />
                </>
            );
        }

        const container = document.querySelector('.js-container');
        ReactDOM.createRoot(container).render(<App />);
    </script>
</body>
</html>
